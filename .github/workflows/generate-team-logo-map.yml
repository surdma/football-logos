name: Generate Team Logo Map

on:
  push:
    branches:
      - agent/generate-team-logo-map

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate team logo JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote

          repository = "surdma/football-logos"
          branch = "master"

          logo_files = sorted(
              Path("logos").rglob("*.png"),
              key=lambda path: path.as_posix().casefold(),
          )

          teams = [
              {
                  "team": logo_file.stem,
                  "logo": (
                      f"https://raw.githubusercontent.com/{repository}/{branch}/"
                      f"{quote(logo_file.as_posix(), safe='/')}"
                  ),
              }
              for logo_file in logo_files
          ]

          Path("team-logos.json").write_text(
              json.dumps(teams, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Generated {len(teams)} team-logo mappings")
          PY

      - name: Commit generated JSON
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- team-logos.json)" ]; then
            echo "team-logos.json is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-logos.json
          git commit -m "generate team logo map"
          git push
